<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - SPIN Store</title>

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="https://i.ibb.co/LdTF1vs0/image.png">

  <!-- YOUR EXTERNAL CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav>
    <div class="top-logo">
      <img src="https://i.ibb.co/LdTF1vs0/image.png" alt="SPIN Store Logo">
    </div>

    <h2>SPIN Store</h2>

    <!-- MENU ICON -->
    <div class="menu-icon" onclick="toggleMenu()" aria-label="Toggle menu">⋮</div>

    <!-- DROPDOWN -->
    <div id="dropdownMenu" class="dropdown-menu">
      <!-- LIVE CLOCK -->
      <div class="menu-clock" id="menuClock">00:00:00</div>

      <div onclick="goPage('/')">Home</div>
      <div onclick="goPage('/tool')">Tools</div>
      <div onclick="goPage('/rule')">Rules</div>
      <div onclick="goPage('/telegram')">Official</div>
    </div>
  </nav>

  <!-- HEADER -->
  <header>
    <!-- TELEGRAM LOGO -->
    <div class="telegram-logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram Logo">
    </div>

    <h1>Connect with Us</h1>
    <p>Choose how you want to join</p>
  </header>

  <!-- MAIN CONTENT -->
  <main class="container">
    <div class="card">
      <div class="card-info">
        <h3>Chat Support</h3>
        <p class="subtitle">Talk directly with Admin</p>
      </div>
      <button onclick="openChat()">Open Chat</button>
    </div>

    <div class="card">
      <div class="card-info">
        <h3>Join Channel</h3>
        <p class="subtitle">Get updates &amp; offers</p>
      </div>
      <button onclick="openChannel()">Join Channel</button>
    </div>
  </main>

  <!-- VHS EFFECT -->
  <div class="vhs-line"></div>

  <!-- FOOTER -->
  <footer>© 2026 Store</footer>

  <!-- JS -->
  <script src="script.js"></script>
  <script>
    // Live Clock Function
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const clockElement = document.getElementById('menuClock');
      if (clockElement) {
        clockElement.textContent = `${hours}:${minutes}:${seconds}`;
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Toggle Dropdown Menu
    function toggleMenu() {
      const dropdown = document.getElementById('dropdownMenu');
      dropdown.classList.toggle('active');
    }

    // Page Navigation Handler
    function goPage(path) {
      window.location.href = path;
    }

    // Links Handlers
    function openChat() {
      window.open("https://t.me/Spin011_cc", "_blank");
    }

    function openChannel() {
      window.open("https://t.me/YOUR_CHANNEL_LINK", "_blank");
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', function(event) {
      const dropdown = document.getElementById('dropdownMenu');
      const menuIcon = document.querySelector('.menu-icon');
      if (dropdown && menuIcon && !menuIcon.contains(event.target) && !dropdown.contains(event.target)) {
        dropdown.classList.remove('active');
      }
    });
  </script>

</body>
</html>
