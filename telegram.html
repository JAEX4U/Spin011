<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - SPIN Store</title>

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="https://i.ibb.co/LdTF1vs0/image.png">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav>
    <div class="top-logo">
      <img src="https://i.ibb.co/LdTF1vs0/image.png" alt="SPIN Store Logo">
    </div>

    <h2>SPIN Store</h2>

    <!-- MENU ICON -->
    <div class="menu-icon" onclick="toggleMenu()" aria-label="Toggle menu">⋮</div>

    <!-- DROPDOWN -->
    <div id="dropdownMenu" class="dropdown-menu">
      <!-- LIVE CLOCK -->
      <div class="menu-clock" id="menuClock">00:00:00</div>

      <div onclick="goPage('/')">Home</div>
      <div onclick="goPage('/tool')">Tools</div>
      <div onclick="goPage('/rule')">Rules</div>
      <div onclick="goPage('/telegram')">Contact</div>
    </div>
  </nav>

  <!-- HEADER -->
  <header>
    <!-- TELEGRAM LOGO -->
    <div class="telegram-logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram Logo">
    </div>

    <h1>Connect with Us</h1>
    <p>Choose how you want to join</p>
  </header>

  <!-- MAIN CONTENT -->
  <main class="container">
    <div class="card">
      <h3>Chat Support</h3>
      <p class="subtitle">Talk directly with Admin</p>
      <button onclick="openChat()">Open Chat</button>
    </div>

    <div class="card">
      <h3>Join Channel</h3>
      <p class="subtitle">Get updates &amp; offers</p>
      <button onclick="openChannel()">Join Channel</button>
    </div>
  </main>

  <!-- VHS EFFECT -->
  <div class="vhs-line"></div>

  <!-- FOOTER -->
  <footer>© 2026 Store</footer>

  <!-- JS -->
  <script src="script.js"></script>
  <script>
    function openChat() {
      window.open("https://t.me/Spin011_cc", "_blank");
    }

    function openChannel() {
      window.open("https://t.me/YOUR_CHANNEL_LINK", "_blank");
    }
  </script>

</body>
</html>
