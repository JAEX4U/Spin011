<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Register - SPIN Store</title>

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="https://i.ibb.co/LdTF1vs0/image.png">

  <!-- EXTERNAL CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav>
    <div class="top-logo">
      <img src="https://i.ibb.co/LdTF1vs0/image.png" alt="SPIN Store Logo">
    </div>

    <h2>SPIN Store</h2>

    <!-- MENU ICON -->
    <div class="menu-icon" onclick="toggleMenu()" aria-label="Toggle menu">⋮</div>

    <!-- DROPDOWN -->
    <div id="dropdownMenu" class="dropdown-menu">
      <div class="menu-clock" id="menuClock">00:00:00</div>

      <div onclick="goPage('/')">Home</div>
      <div onclick="goPage('/tool')">Tools</div>
      <div onclick="goPage('/rule')">Rules</div>
      <div onclick="goPage('/news')">News</div>
      <div onclick="goPage('/telegram')">Official</div>
    </div>
  </nav>

  <!-- HEADER -->
  <header>
    <h1>User Portal</h1>
    <p>Sign in or register to access tools and dashboard</p>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="container">

    <!-- TAB SWITCHING BUTTONS -->
    <div class="category-buttons" style="grid-column: 1 / -1;">
      <button type="button" id="loginTabBtn" onclick="switchTab('login')">LOGIN</button>
      <button type="button" id="registerTabBtn" onclick="switchTab('register')">REGISTER</button>
    </div>

    <!-- LOGIN CARD -->
    <div class="card" id="loginCard" style="grid-column: 1 / -1; max-width: 450px; margin: 0 auto; width: 100%;">
      <div class="card-info">
        <h3>Account Login</h3>
        <p class="subtitle">Enter your credentials below</p>
      </div>

      <form onsubmit="handleLogin(event)" style="display: flex; flex-direction: column; gap: 12px; margin-top: 10px;">
        <div>
          <label class="subtitle">USERNAME / EMAIL</label>
          <input type="text" id="loginUser" required placeholder="Enter username..." style="width: 100%; padding: 8px; background: #000; border: 2px solid #ff1a1a; color: #fff; font-family: inherit;">
        </div>

        <div>
          <label class="subtitle">PASSWORD</label>
          <input type="password" id="loginPass" required placeholder="Enter password..." style="width: 100%; padding: 8px; background: #000; border: 2px solid #ff1a1a; color: #fff; font-family: inherit;">
        </div>

        <button type="submit" style="margin-top: 10px;">ACCESS ACCOUNT</button>
      </form>
    </div>

    <!-- REGISTER CARD (WITH MAILTRAP OTP) -->
    <div class="card" id="registerCard" style="grid-column: 1 / -1; max-width: 450px; margin: 0 auto; width: 100%; display: none;">
      <div class="card-info">
        <h3>Create Account</h3>
        <p class="subtitle">Verify email via OTP to register</p>
      </div>

      <!-- STEP 1: USER DETAILS -->
      <div id="regStep1" style="display: flex; flex-direction: column; gap: 12px; margin-top: 10px;">
        <div>
          <label class="subtitle">USERNAME</label>
          <input type="text" id="regUser" required placeholder="Choose a username..." style="width: 100%; padding: 8px; background: #000; border: 2px solid #ff1a1a; color: #fff; font-family: inherit;">
        </div>

        <div>
          <label class="subtitle">EMAIL ADDRESS</label>
          <input type="email" id="regEmail" required placeholder="Enter email address..." style="width: 100%; padding: 8px; background: #000; border: 2px solid #ff1a1a; color: #fff; font-family: inherit;">
        </div>

        <div>
          <label class="subtitle">TELEGRAM USERNAME</label>
          <input type="text" id="regTelegram" placeholder="@username (Optional)" style="width: 100%; padding: 8px; background: #000; border: 2px solid #ff1a1a; color: #fff; font-family: inherit;">
        </div>

        <div>
          <label class="subtitle">PASSWORD</label>
          <input type="password" id="regPass" required placeholder="Create password..." style="width: 100%; padding: 8px; background: #000; border: 2px solid #ff1a1a; color: #fff; font-family: inherit;">
        </div>

        <button type="button" onclick="sendOTP()" style="margin-top: 10px;">SEND OTP CODE</button>
      </div>

      <!-- STEP 2: OTP VERIFICATION (HIDDEN AT FIRST) -->
      <div id="regStep2" style="display: none; flex-direction: column; gap: 12px; margin-top: 10px;">
        <div>
          <label class="subtitle" style="color: #00ff00;">ENTER 6-DIGIT OTP CODE</label>
          <input type="text" id="otpInput" maxlength="6" placeholder="123456" style="width: 100%; padding: 10px; background: #000; border: 2px solid #00ff00; color: #fff; text-align: center; font-size: 20px; letter-spacing: 5px; font-family: inherit;">
        </div>

        <button type="button" onclick="verifyOTP()" style="margin-top: 10px; background: #00ff00; color: #000; font-weight: bold;">VERIFY &amp; REGISTER</button>
        <button type="button" onclick="resetSteps()" style="background: transparent; border: none; color: #aaa; text-decoration: underline; cursor: pointer; padding: 5px;">Change Email / Go Back</button>
      </div>
    </div>

  </main>

  <!-- VHS SCANNING LINE -->
  <div class="vhs-line"></div>

  <!-- FOOTER -->
  <footer>© 2026 SPIN Store. All Rights Reserved.</footer>

  <!-- EXTERNAL SCRIPT -->
  <script src="script.js"></script>

  <!-- PAGE LOGIC & API CALLS -->
  <script>
    // Replace this with your actual Render API URL once deployed
    const BACKEND_URL = "https://spin-store-api.onrender.com";

    // Tab Switcher Function
    function switchTab(tab) {
      const loginCard = document.getElementById('loginCard');
      const registerCard = document.getElementById('registerCard');

      if (tab === 'login') {
        loginCard.style.display = 'block';
        registerCard.style.display = 'none';
      } else {
        loginCard.style.display = 'none';
        registerCard.style.display = 'block';
      }
    }

    // Handle Standard Login
    function handleLogin(event) {
      event.preventDefault();
      alert('Logging in...');
    }

    // Step 1: Request OTP from backend via Mailtrap
    async function sendOTP() {
      const email = document.getElementById('regEmail').value.trim();
      const username = document.getElementById('regUser').value.trim();
      const password = document.getElementById('regPass').value.trim();

      if (!username || !email || !password) {
        alert('Please fill in all required fields first!');
        return;
      }

      try {
        const response = await fetch(`${BACKEND_URL}/api/send-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        });

        const result = await response.json();

        if (response.ok) {
          alert('OTP sent! Check your email inbox.');
          document.getElementById('regStep1').style.display = 'none';
          document.getElementById('regStep2').style.display = 'flex';
        } else {
          alert(result.message || 'Failed to send OTP.');
        }
      } catch (error) {
        alert('Server connection error. Ensure your backend server is running.');
      }
    }

    // Step 2: Verify OTP and complete sign-up
    async function verifyOTP() {
      const email = document.getElementById('regEmail').value.trim();
      const otp = document.getElementById('otpInput').value.trim();

      if (!otp || otp.length !== 6) {
        alert('Please enter a valid 6-digit OTP code.');
        return;
      }

      try {
        const response = await fetch(`${BACKEND_URL}/api/verify-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, otp: otp })
        });

        const result = await response.json();

        if (response.ok) {
          alert('Verification successful! Your account is created.');
          window.location.href = '/';
        } else {
          alert(result.message || 'Invalid OTP code.');
        }
      } catch (error) {
        alert('Verification error. Try again.');
      }
    }

    // Reset steps if user needs to edit email
    function resetSteps() {
      document.getElementById('regStep1').style.display = 'flex';
      document.getElementById('regStep2').style.display = 'none';
    }

    // Page Router Helper
    function goPage(path) {
      window.location.href = path;
    }
  </script>

</body>
</html>
